openapi: 3.0.3
info:
  title: Level2 Mathmodel API
  description: |
    Draft API for the Level2-mathmodel monitoring + planning MVP.

    **Boundaries (Wave 0 / MVP):**
    - Reads Level2 Collector via `LEVEL2_API_URL` (read-only client).
    - Owns only **local variables** and planning stubs — never writes to PLC / Level2.
    - Separate containers/images from Level2; default host port **8090**.
  version: 0.1.0-draft
  contact:
    name: popelev / Level2-mathmodel

servers:
  - url: http://127.0.0.1:8090
    description: Lab mathmodel (host port 8090)

security: []

tags:
  - name: health
  - name: live
  - name: local_vars
  - name: plan

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      responses:
        "200":
          description: Process up
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      tags: [health]
      summary: Readiness (engine + optional Level2 reachability)
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: Not ready

  /api/v1/status:
    get:
      tags: [health]
      summary: Engine status summary
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineStatus"

  /api/v1/live/inputs:
    get:
      tags: [live]
      summary: Live inputs summary (read-only projection from Level2)
      description: |
        Aggregated view of Level2 tags/samples used by the math model.
        Source of truth remains Level2 Collector; this endpoint does not write back.
      responses:
        "200":
          description: Live inputs summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveInputsSummary"
        "502":
          description: Level2 upstream unavailable

  /api/v1/local-vars:
    get:
      tags: [local_vars]
      summary: List local variables
      responses:
        "200":
          description: Local vars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocalVar"
    post:
      tags: [local_vars]
      summary: Create local variable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalVarInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalVar"
        "400":
          description: Invalid body
        "409":
          description: Id already exists

  /api/v1/local-vars/{id}:
    parameters:
      - $ref: "#/components/parameters/LocalVarId"
    get:
      tags: [local_vars]
      summary: Get local variable
      responses:
        "200":
          description: Local var
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalVar"
        "404":
          description: Not found
    put:
      tags: [local_vars]
      summary: Replace local variable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalVarInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalVar"
        "404":
          description: Not found
    delete:
      tags: [local_vars]
      summary: Delete local variable
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /api/v1/plan:
    get:
      tags: [plan]
      summary: Get current plan stub
      responses:
        "200":
          description: Plan stub (Wave 0 placeholder)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanStub"
    post:
      tags: [plan]
      summary: Request plan computation (stub)
      description: Wave 0 returns a stub; real planning lands in later waves.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "202":
          description: Accepted (stub)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanStub"
        "501":
          description: Not implemented yet

components:
  parameters:
    LocalVarId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    ReadyStatus:
      type: object
      required: [ready]
      properties:
        ready:
          type: boolean
        level2_reachable:
          type: boolean
        detail:
          type: string

    EngineStatus:
      type: object
      required: [service, version, mode]
      properties:
        service:
          type: string
          example: level2-mathmodel
        version:
          type: string
          example: 0.1.0-draft
        mode:
          type: string
          enum: [scaffold, monitoring, planning]
          example: scaffold
        level2_api_url:
          type: string
          example: http://level2-collector:8080
        local_var_count:
          type: integer
          minimum: 0

    LiveInputsSummary:
      type: object
      required: [source, updated_at, tags]
      properties:
        source:
          type: string
          example: level2
        updated_at:
          type: string
          format: date-time
        tag_count:
          type: integer
        tags:
          type: array
          items:
            $ref: "#/components/schemas/LiveTagSummary"

    LiveTagSummary:
      type: object
      required: [tag_id, quality]
      properties:
        tag_id:
          type: string
        device_id:
          type: string
        value_num:
          type: number
          nullable: true
        quality:
          type: integer
          description: "0=Good, 1=Bad (Level2 sample quality)"
        time:
          type: string
          format: date-time

    LocalVar:
      type: object
      required: [id, name, value]
      properties:
        id:
          type: string
        name:
          type: string
        value:
          description: Scalar or structured local value (engine-owned only)
          nullable: true
        unit:
          type: string
        description:
          type: string
        updated_at:
          type: string
          format: date-time

    LocalVarInput:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        value:
          nullable: true
        unit:
          type: string
        description:
          type: string

    PlanRequest:
      type: object
      properties:
        horizon_hours:
          type: number
          example: 8
        notes:
          type: string

    PlanStub:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [stub, pending, ready, error]
          example: stub
        message:
          type: string
          example: Planning not implemented in Wave 0
        requested_at:
          type: string
          format: date-time
        horizon_hours:
          type: number
          nullable: true
