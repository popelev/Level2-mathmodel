openapi: 3.0.3
info:
  title: Level2 Mathmodel API
  description: |
    Draft API for the Level2-mathmodel monitoring + planning MVP.

    **Boundaries (Wave 0 / MVP):**
    - Reads Level2 Collector via `LEVEL2_API_URL` (read-only client).
    - Owns **local variables**, **tag catalog/bindings** (imported from Level2), and planning stubs.
    - Never writes to PLC / Level2.
    - Separate containers/images from Level2; default host port **8090**.
  version: 0.2.0-draft
  contact:
    name: popelev / Level2-mathmodel

servers:
  - url: http://127.0.0.1:8090
    description: Lab mathmodel (host port 8090)

security: []

tags:
  - name: health
  - name: live
  - name: local_vars
  - name: imports
  - name: bindings
  - name: plan

paths:
  /healthz:
    get:
      tags: [health]
      summary: Liveness
      responses:
        "200":
          description: Process up
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /readyz:
    get:
      tags: [health]
      summary: Readiness (engine + optional Level2 reachability)
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyStatus"
        "503":
          description: Not ready

  /api/v1/status:
    get:
      tags: [health]
      summary: Engine status summary
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EngineStatus"

  /api/v1/live/inputs:
    get:
      tags: [live]
      summary: Live inputs summary (read-only projection from Level2)
      description: |
        Aggregated view of Level2 tags/samples used by the math model.
        Source of truth remains Level2 Collector; this endpoint does not write back.
      responses:
        "200":
          description: Live inputs summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveInputsSummary"
        "502":
          description: Level2 upstream unavailable

  /api/v1/local-vars:
    get:
      tags: [local_vars]
      summary: List local variables
      responses:
        "200":
          description: Local vars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LocalVar"
    post:
      tags: [local_vars]
      summary: Create local variable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalVarInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalVar"
        "400":
          description: Invalid body
        "409":
          description: Id already exists

  /api/v1/local-vars/{id}:
    parameters:
      - $ref: "#/components/parameters/LocalVarId"
    get:
      tags: [local_vars]
      summary: Get local variable
      responses:
        "200":
          description: Local var
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalVar"
        "404":
          description: Not found
    put:
      tags: [local_vars]
      summary: Replace local variable
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocalVarInput"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocalVar"
        "404":
          description: Not found
    delete:
      tags: [local_vars]
      summary: Delete local variable
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /api/v1/imports/level2/tags:
    post:
      tags: [imports]
      summary: Import tags from Level2 into catalog
      description: |
        Read-only fetch via Level2Client preferring
        `GET /api/v1/integration/tag-catalog` (OpenAPI 1.4.0+).
        Falls back to `GET /api/v1/devices` + `GET /api/v1/tags` only on HTTP 404.
        Upserts `TagCatalogEntry` rows keyed by `tag_id` + `device_id`.
        Requires `LEVEL2_API_URL`. Optional `LEVEL2_API_TOKEN` is forwarded as Bearer / X-API-Token.
      responses:
        "200":
          description: Import counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Level2ImportResult"
        "503":
          description: Level2 unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Level2UnavailableError"

  /api/v1/imports/level2/tags/preview:
    post:
      tags: [imports]
      summary: Preview Level2 tag import (dry-run)
      description: Same fetch/normalize as import, but does not persist catalog.
      responses:
        "200":
          description: Dry-run result with preview rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Level2ImportPreview"
        "503":
          description: Level2 unreachable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Level2UnavailableError"

  /api/v1/imports/level2/catalog:
    get:
      tags: [imports]
      summary: List imported Level2 tag catalog
      responses:
        "200":
          description: Catalog entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagCatalogEntry"

  /api/v1/bindings:
    get:
      tags: [bindings]
      summary: List logical tag bindings
      responses:
        "200":
          description: Bindings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagBinding"
    put:
      tags: [bindings]
      summary: Replace or upsert bindings
      description: |
        Body may be a binding array (replace) or
        `{ "mode": "replace"|"upsert", "bindings": [...] }`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items:
                    $ref: "#/components/schemas/TagBinding"
                - $ref: "#/components/schemas/TagBindingsPut"
      responses:
        "200":
          description: Current bindings after write
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TagBinding"
        "400":
          description: Invalid body

  /api/v1/bindings/{logical_name}:
    parameters:
      - name: logical_name
        in: path
        required: true
        schema:
          type: string
    delete:
      tags: [bindings]
      summary: Delete one binding
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found

  /api/v1/plan:
    get:
      tags: [plan]
      summary: Get current plan stub
      responses:
        "200":
          description: Plan stub (Wave 0 placeholder)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanStub"
    post:
      tags: [plan]
      summary: Request plan computation (stub)
      description: Wave 0 returns a stub; real planning lands in later waves.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlanRequest"
      responses:
        "202":
          description: Accepted (stub)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlanStub"
        "501":
          description: Not implemented yet

components:
  parameters:
    LocalVarId:
      name: id
      in: path
      required: true
      schema:
        type: string

  schemas:
    ReadyStatus:
      type: object
      required: [ready]
      properties:
        ready:
          type: boolean
        level2_reachable:
          type: boolean
        detail:
          type: string

    EngineStatus:
      type: object
      required: [service, version, mode]
      properties:
        service:
          type: string
          example: level2-mathmodel
        version:
          type: string
          example: 0.1.0-draft
        mode:
          type: string
          enum: [scaffold, monitoring, planning]
          example: scaffold
        level2_api_url:
          type: string
          example: http://level2-collector:8080
        local_var_count:
          type: integer
          minimum: 0
        tag_catalog_count:
          type: integer
          minimum: 0
        binding_count:
          type: integer
          minimum: 0

    TagCatalogEntry:
      type: object
      required: [tag_id, device_id]
      properties:
        tag_id:
          type: string
          description: Stable Level2 tag id
        device_id:
          type: string
        path:
          type: string
        datatype:
          type: string
        enabled:
          type: boolean
        writable:
          type: boolean
        interval_ms:
          type: integer
        node_id:
          type: string
        last_seen_at:
          type: string
          format: date-time
        raw:
          type: object
          additionalProperties: true
          description: Optional debug snapshot from Level2 row

    TagBinding:
      type: object
      required: [logical_name, tag_id]
      properties:
        logical_name:
          type: string
          description: Engine logical name for the bound tag
        tag_id:
          type: string
        device_id:
          type: string
        role:
          type: string
          enum: [input, output]
          default: input
        section_id:
          type: string
          description: Optional copper section reference
        cell_id:
          type: string
          description: Optional copper cell reference
        signal:
          type: string
          description: Optional copper signal name

    TagBindingsPut:
      type: object
      required: [bindings]
      properties:
        mode:
          type: string
          enum: [replace, upsert]
          default: replace
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/TagBinding"

    Level2ImportResult:
      type: object
      required: [dry_run, devices_seen, tags_fetched, inserted, updated, total]
      properties:
        dry_run:
          type: boolean
          example: false
        devices_seen:
          type: integer
        tags_fetched:
          type: integer
        inserted:
          type: integer
        updated:
          type: integer
        total:
          type: integer
        source:
          type: string
          description: Import transport used
          enum: [tag_catalog, tags_fallback]
          example: tag_catalog
        level2_api_version:
          type: string
          description: Present when source is tag_catalog
          example: "1.4.0"
        exported_at:
          type: string
          format: date-time
          description: Present when source is tag_catalog

    Level2ImportPreview:
      allOf:
        - $ref: "#/components/schemas/Level2ImportResult"
        - type: object
          properties:
            preview:
              type: array
              items:
                $ref: "#/components/schemas/TagCatalogEntry"

    Level2UnavailableError:
      type: object
      required: [error, detail]
      properties:
        error:
          type: string
          example: level2_unavailable
        detail:
          type: string

    LiveInputsSummary:
      type: object
      required: [source, updated_at, tags]
      properties:
        source:
          type: string
          example: level2
        updated_at:
          type: string
          format: date-time
        tag_count:
          type: integer
        tags:
          type: array
          items:
            $ref: "#/components/schemas/LiveTagSummary"

    LiveTagSummary:
      type: object
      required: [tag_id, quality]
      properties:
        tag_id:
          type: string
        device_id:
          type: string
        value_num:
          type: number
          nullable: true
        quality:
          type: integer
          description: "0=Good, 1=Bad (Level2 sample quality)"
        time:
          type: string
          format: date-time

    LocalVar:
      type: object
      required: [id, name, type, value, source, updated_at]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [num, bool, text]
          description: Local scalar type (engine-owned only)
        value:
          description: Value matching type (num|bool|text); null allowed
          nullable: true
        source:
          type: string
          enum: [planner, operator, model]
          description: Who last wrote the variable (never Level2/PLC)
        unit:
          type: string
        description:
          type: string
        updated_at:
          type: string
          format: date-time

    LocalVarInput:
      type: object
      required: [id, name, type, source]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [num, bool, text]
        value:
          nullable: true
        source:
          type: string
          enum: [planner, operator, model]
        unit:
          type: string
        description:
          type: string

    PlanRequest:
      type: object
      properties:
        horizon_hours:
          type: number
          example: 8
        notes:
          type: string

    PlanStub:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [stub, pending, ready, error]
          example: stub
        message:
          type: string
          example: Planning not implemented in Wave 0
        requested_at:
          type: string
          format: date-time
        horizon_hours:
          type: number
          nullable: true
